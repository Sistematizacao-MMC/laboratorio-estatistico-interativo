name: Testes

on:
  push:
    branches:
      - modulo-5-fernando
  pull_request:
    branches:
      - modulo-5-fernando

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verificar requisitos
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Arquivos encontrados:"
          find "$GITHUB_WORKSPACE" -type f -name "requisitos.txt" -print

      - name: Instalar dependências
        run: |
          REQUISITOS=$(find "$GITHUB_WORKSPACE" -type f -name "requisitos.txt" -print -quit)

          if [ -z "$REQUISITOS" ]; then
            echo "ERRO: requisitos.txt não foi encontrado."
            exit 1
          fi

          echo "Arquivo encontrado em: $REQUISITOS"
          python -m pip install -r "$REQUISITOS"

      - name: Testes do Executor
        run: PYTHONPATH=. pytest
